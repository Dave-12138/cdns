name: 更新文件

# 控制时机
on:
  # push 时
  push:
    branches: ["main"]


permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 取当前版本
      - name: Checkout
        uses: actions/checkout@v7
      - name: 配置 pages
        uses: actions/configure-pages@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      # 上传要用的部分用于 pages
      - name: 上传 artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
